<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;font-family:ui-sans-serif,system-ui,sans-serif}
body{margin:0;width:300px;padding:14px;background:#f8fafc;color:#0f172a}
h1{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.card{background:#fff;border-radius:14px;padding:12px;border:1px solid #e2e8f0}
.row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
label{font-size:13px;font-weight:600}
select,input[type=range]{width:100%}
.range-wrap{display:flex;gap:8px;align-items:center}
.range-wrap span{font-weight:700;color:#0284c7;min-width:52px;text-align:right;font-size:13px}
.btn{width:100%;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#0ea5e9;color:#fff;margin-top:10px}
.ghost{background:#f1f5f9;color:#334155;margin-top:8px}
.hint{font-size:11px;color:#64748b;margin-top:8px;line-height:1.4}
.next{font-size:11px;color:#0ea5e9;margin-top:6px;font-weight:600}
/* power switch */
.power{display:flex;align-items:center;gap:10px}
.power-txt{flex:1}
.power-txt b{font-size:13.5px;display:block}
.power-txt span{font-size:11px;color:#64748b}
.switch{width:46px;height:26px;flex:none;border:0;border-radius:999px;background:#cbd5e1;position:relative;cursor:pointer;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:#22c55e}
.switch.on::after{transform:translateX(20px)}
.card.off{opacity:.45;pointer-events:none;transition:opacity .2s}
</style>
</head>
<body>
<h1>💧 Drink Reminder</h1>
<div class="card">
  <div class="power">
    <div class="power-txt">
      <b id="power-title">Pengingat aktif</b>
      <span id="power-state">Akan muncul tiap interval</span>
    </div>
    <button id="power" class="switch on" role="switch" aria-checked="true" aria-label="Nyalakan/matikan pengingat"></button>
  </div>
</div>
<div class="card off" id="settings" style="margin-top:10px">
  <label>Ingatkan setiap</label>
  <div class="range-wrap">
    <input id="interval" type="range" min="5" max="120" step="5">
    <span id="val">30m</span>
  </div>
  <div class="row" style="font-size:11px;color:#64748b">
    <span>5m</span><span>120m</span>
  </div>
  <div class="row" style="margin-top:10px">
    <label for="mute" style="font-size:13px;font-weight:600;cursor:pointer">🔊 Suara pengamen</label>
    <input id="mute" type="checkbox" style="width:16px;height:16px;cursor:pointer;accent-color:#0ea5e9">
  </div>
  <div id="next" class="next"></div>
  <button id="test" class="btn ghost">▶ Test sekarang</button>
  <button id="save" class="btn primary">Simpan</button>
  <p class="hint">Video + lagu akan muncul di halaman web & mengulang sampai kamu klik “Aku sudah minum”.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
